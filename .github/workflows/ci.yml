name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first. Type-aware lint rules and typecheck both need the
      # workspace packages' generated .d.ts files, which do not exist in a
      # clean checkout. Linting first makes cross-package imports resolve to
      # `any` and fails the no-unsafe-* rules.
      - name: Build
        run: pnpm run build

      # The same step the docs deploy runs: a docs link to a story Storybook
      # does not have fails here, before it reaches main.
      - name: Assemble the docs site with Storybook
        run: pnpm run assemble:site

      # Everything a publish would do except the upload: packs each public
      # package and validates its manifest, so a broken files list or a
      # workspace: range that failed to resolve fails here, not on release day.
      - name: Publish dry run
        run: pnpm run publish:dry-run

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
