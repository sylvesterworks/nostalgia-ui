name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages needs these three. contents is read-only: nothing is committed.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The docs app imports the workspace packages, so the whole repo builds
      # through turbo rather than the docs app alone. This is also why the
      # Astro-specific deploy action is not used: it would install and build
      # inside apps/docs only and miss those dependencies.
      - name: Build
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
