name: Release

on:
  push:
    branches: [main]
  # Manual run: re-publishes the MCP Registry listing for whatever version is
  # on main. Used once to list the first release, which was published to npm
  # before this step existed.
  workflow_dispatch:

# contents and pull-requests: the changesets action pushes a branch and opens
# the Version Packages pull request. id-token: both npm Trusted Publishing and
# the MCP Registry authenticate this workflow through a GitHub OIDC token, so
# no token is stored anywhere. Provenance attestations are generated
# automatically.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # With pending changesets this opens or refreshes the Version Packages
      # pull request. With none, and a version on main that is not yet on
      # npm, it publishes. Each package's trusted publisher on npm is bound to
      # this repository and this workflow file, so publishing works from here
      # and nowhere else.
      - name: Version or publish
        id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: 'Version packages'
          pr-title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The MCP Registry hosts metadata that points at the npm package, so the
      # listing is published only after npm has the version. The registry
      # verifies the package's mcpName against server.json's name, and the
      # OIDC login grants the io.github.sylvesterworks/ namespace because this
      # repository belongs to that organisation.
      - name: Install mcp-publisher
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        run: ./mcp-publisher login github-oidc

      - name: Publish the listing to the MCP Registry
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: packages/mcp
        run: ../../mcp-publisher publish
