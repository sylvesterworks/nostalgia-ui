name: Release

on:
  push:
    branches: [main]

# contents and pull-requests: the changesets action pushes a branch and opens
# the Version Packages pull request. id-token: npm Trusted Publishing, which
# exchanges a GitHub OIDC token for publish rights, so no npm token is stored
# anywhere. Provenance attestations are generated automatically.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # With pending changesets this opens or refreshes the Version Packages
      # pull request. With none, and a version on main that is not yet on
      # npm, it publishes. Each package's trusted publisher on npm is bound to
      # this repository and this workflow file, so publishing works from here
      # and nowhere else.
      - name: Version or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: 'Version packages'
          pr-title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
